<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login | College Canteen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <style>
    body { background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
    .login-card { background: #fff; border-radius: 20px; box-shadow: 0 20px 60px rgba(230,81,0,0.15); padding: 2.5rem 2rem; width: 100%; max-width: 420px; }
    .login-icon { width: 80px; height: 80px; background: linear-gradient(135deg, #e65100, #ff8f00); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; box-shadow: 0 8px 25px rgba(230,81,0,0.35); }
    .login-icon i { font-size: 2.2rem; color: #fff; }
    .login-title { text-align: center; font-size: 1.6rem; font-weight: 700; color: #bf360c; margin-bottom: 0.25rem; }
    .login-subtitle { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 1.8rem; }
    .form-control { border-radius: 10px; border: 1.5px solid #ffe0b2; padding: 0.65rem 1rem; transition: border-color 0.2s; }
    .form-control:focus { border-color: #e65100; box-shadow: 0 0 0 3px rgba(230,81,0,0.12); }
    .input-group-text { background: #fff3e0; border: 1.5px solid #ffe0b2; border-radius: 10px 0 0 10px; color: #e65100; }
    .btn-login { background: linear-gradient(135deg, #e65100, #ff8f00); border: none; border-radius: 10px; padding: 0.7rem; font-size: 1rem; font-weight: 600; color: #fff; width: 100%; transition: opacity 0.2s, transform 0.1s; }
    .btn-login:hover { opacity: 0.92; transform: translateY(-1px); color: #fff; }
    .alert { border-radius: 10px; font-size: 0.9rem; }
    .canteen-brand { text-align: center; margin-top: 1.5rem; color: #bbb; font-size: 0.8rem; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-icon"><i class="bi bi-egg-fried"></i></div>
  <div class="login-title">College Canteen</div>
  <div class="login-subtitle">Admin Management Portal</div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} py-2">
          <i class="bi bi-exclamation-circle me-1"></i>{{ msg }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="POST" action="{{ url_for('login') }}">
    <div class="mb-3">
      <label class="form-label fw-semibold text-secondary small">Email Address</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input type="email" name="email" class="form-control" placeholder="admin@canteen.com" required autofocus/>
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label fw-semibold text-secondary small">Password</label>
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
      </div>
    </div>
    <button type="submit" class="btn-login">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
    </button>
  </form>
  <div class="canteen-brand">
    <i class="bi bi-cup-hot me-1"></i>Powered by Canteen Management System
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
